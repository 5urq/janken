<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>相手の手を待っています</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      font-family: sans-serif;
      margin-top: 40px;
    }

    .logout-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: flex-end;
    }

    .logout-bar a {
      color: #dc3545;
      text-decoration: none;
      font-size: 14px;
    }

    .logout-bar a:hover {
      text-decoration: underline;
    }

    .wait-box,
    .result-box {
      background-color: #f8f9fa;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      padding: 20px 40px;
      text-align: center;
      min-width: 250px;
    }

    .result-text {
      font-size: 20px;
      font-weight: bold;
      color: #d9534f;
    }

    .top-link {
      margin-top: 24px;
      font-size: 14px;
    }
  </style>
  <script>
    window.onload = function () {
      var sse = new EventSource('/kekka');
      sse.onmessage = function (event) {
        console.log("SSE received:", event.data);
        var match = JSON.parse(event.data);
        var waitBox = document.getElementById("wait_box");
        var resultArea = document.getElementById("result_area");

        if (waitBox) {
          waitBox.style.display = "none";
        }

        if (resultArea) {
          resultArea.innerHTML = "<h2>対戦結果</h2>"
            + "<p>試合ID: " + match.id + "</p>"
            + "<p>ユーザ1 (ID: " + match.user1 + "): " + match.user1Hand + "</p>"
            + "<p>ユーザ2 (ID: " + match.user2 + "): " + match.user2Hand + "</p>"
            + "<p><a href='/janken'>[もどる]</a></p>";
          resultArea.style.display = "block";
        }

        sse.close();
      };
    };
  </script>
</head>

<body>
  <div class="logout-bar">
    <a href="/logout">ログアウト</a>
  </div>

  <div th:if="${myUser}">
    <h1>Hi [[${myUser}]]</h1>
  </div>

  <div id="wait_box" class="wait-box">
    <h2>相手の手を待ってます</h2>
  </div>

  <div id="result_area" class="result-box" style="display: none;"></div>

  <div class="top-link">
    <a href="/janken">もどる</a>
  </div>
</body>

</html>
