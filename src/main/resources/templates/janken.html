<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>じゃんけんゲーム</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      font-family: sans-serif;
      margin-top: 40px;
    }

    .hand-links {
      display: flex;
      gap: 20px;
      margin: 16px 0;
    }

    .hand-links a {
      display: inline-block;
      padding: 10px 24px;
      font-size: 18px;
      text-decoration: none;
      background-color: #28a745;
      color: white;
      border-radius: 6px;
      font-weight: bold;
    }

    .hand-links a:hover {
      background-color: #218838;
    }

    .result-box {
      background-color: #f8f9fa;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      padding: 20px 40px;
      text-align: center;
      min-width: 250px;
    }

    .result-box p {
      font-size: 18px;
      margin: 8px 0;
    }

    .result-text {
      font-size: 24px;
      font-weight: bold;
      color: #d9534f;
    }

    .top-link {
      margin-top: 24px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>じゃんけんゲーム</h1>

  <!-- Task 1: index.htmlから参加した場合のみ userName が渡されるため表示される -->
  <div th:if="${userName}">
    <h2>Hi [[${userName}]]</h2>
  </div>

  <!-- Task 2: じゃんけんの手を選択するリンク -->
  <div class="hand-links">
    <a th:href="@{/jankengame(hand='Gu', userName=${userName})}">グー</a>
    <a th:href="@{/jankengame(hand='Choki', userName=${userName})}">チョキ</a>
    <a th:href="@{/jankengame(hand='Pa', userName=${userName})}">パー</a>
  </div>

  <!-- Task 2: 対戦結果の表示（jankenモデルが渡された場合のみ表示） -->
  <div class="result-box" th:if="${janken}">
    <p>あなたの手: <strong>[[${janken.myHand}]]</strong></p>
    <p>相手の手: <strong>[[${janken.cpuHand}]]</strong></p>
    <p class="result-text">結果: [[${janken.result}]]</p>
  </div>

  <div class="top-link">
    <a href="/">トップページ（index.html）へ戻る</a>
  </div>
</body>

</html>
