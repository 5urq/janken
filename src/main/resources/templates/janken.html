<!--
  【AI活用と学習に関する注記】
  本画面（Thymeleafテンプレート）の実装は生成AIを活用して作成していますが、
  Spring Security連携やDIによるオブジェクト共有の画面描画について、
  受講生自身がAIと一緒に動作原理を理解した上で組み込んでいます。
-->
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.springframework.org/schema/security">

<head>
  <meta charset="UTF-8">
  <title>じゃんけんゲーム</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      font-family: sans-serif;
      margin-top: 40px;
    }

    .logout-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: flex-end;
    }

    .logout-bar a {
      color: #dc3545;
      text-decoration: none;
      font-size: 14px;
    }

    .logout-bar a:hover {
      text-decoration: underline;
    }

    .entry-box {
      background-color: #e9ecef;
      border: 1px solid #ced4da;
      border-radius: 8px;
      padding: 12px 24px;
      min-width: 250px;
      text-align: left;
    }

    .entry-box h3 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .entry-box ul {
      margin: 0;
      padding-left: 20px;
    }

    .entry-count {
      margin-top: 8px;
      margin-bottom: 0;
      font-size: 14px;
      color: #495057;
      font-weight: bold;
    }

    .hand-links {
      display: flex;
      gap: 20px;
      margin: 16px 0;
    }

    .hand-links a {
      display: inline-block;
      padding: 10px 24px;
      font-size: 18px;
      text-decoration: none;
      background-color: #28a745;
      color: white;
      border-radius: 6px;
      font-weight: bold;
    }

    .hand-links a:hover {
      background-color: #218838;
    }

    .result-box {
      background-color: #f8f9fa;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      padding: 20px 40px;
      text-align: center;
      min-width: 250px;
    }

    .result-box p {
      font-size: 18px;
      margin: 8px 0;
    }

    .result-text {
      font-size: 24px;
      font-weight: bold;
      color: #d9534f;
    }

    .top-link {
      margin-top: 24px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="logout-bar">
    <a href="/logout">ログアウト</a>
  </div>

  <h1>じゃんけんゲーム</h1>

  <!-- ログインユーザ名の表示 -->
  <div th:if="${userName}">
    <h2>Hi [[${userName}]]</h2>
  </div>

  <!-- エントリー中のユーザ一覧表示 (DBから取得) -->
  <div class="entry-box" th:if="${users}">
    <h3>エントリー</h3>
    <ul>
      <li th:each="user : ${users}">[[${user.name}]]</li>
    </ul>
  </div>

  <!-- じゃんけんの手を選択するリンク -->
  <div class="hand-links">
    <a th:href="@{/jankengame(hand='Gu')}">グー</a>
    <a th:href="@{/jankengame(hand='Choki')}">チョキ</a>
    <a th:href="@{/jankengame(hand='Pa')}">パー</a>
  </div>

  <!-- 対戦結果の表示（jankenモデルが渡された場合のみ表示） -->
  <div class="result-box" th:if="${janken}">
    <p>あなたの手: <strong>[[${janken.myHand}]]</strong></p>
    <p>相手の手: <strong>[[${janken.cpuHand}]]</strong></p>
    <p class="result-text">結果: [[${janken.result}]]</p>
  </div>

  <div class="top-link">
    <a href="/">トップページ（index.html）へ戻る</a>
  </div>
</body>

</html>
