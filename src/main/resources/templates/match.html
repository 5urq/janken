<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>試合</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      font-family: sans-serif;
      margin-top: 40px;
    }

    .logout-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: flex-end;
    }

    .logout-bar a {
      color: #dc3545;
      text-decoration: none;
      font-size: 14px;
    }

    .logout-bar a:hover {
      text-decoration: underline;
    }

    .hand-links {
      display: flex;
      gap: 20px;
      margin: 16px 0;
    }

    .hand-links a {
      display: inline-block;
      padding: 10px 24px;
      font-size: 18px;
      text-decoration: none;
      background-color: #28a745;
      color: white;
      border-radius: 6px;
      font-weight: bold;
    }

    .hand-links a:hover {
      background-color: #218838;
    }

    .result-box {
      background-color: #f8f9fa;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      padding: 20px 40px;
      text-align: center;
      min-width: 250px;
    }

    .result-box p {
      font-size: 18px;
      margin: 8px 0;
    }

    .result-text {
      font-size: 24px;
      font-weight: bold;
      color: #d9534f;
    }

    .top-link {
      margin-top: 24px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="logout-bar">
    <a href="/logout">ログアウト</a>
  </div>

  <h1>試合</h1>

  <!-- 対戦相手表示 -->
  <div th:if="${myUser != null and oppUser != null}">
    <h2>[[${myUser}]] vs [[${oppUser.name}]]</h2>
  </div>

  <!-- じゃんけんの手のリンク -->
  <div class="hand-links" th:if="${oppUser}">
    <a th:href="@{/wait(id=${oppUser.id}, hand='Gu')}">グー</a>
    <a th:href="@{/wait(id=${oppUser.id}, hand='Choki')}">チョキ</a>
    <a th:href="@{/wait(id=${oppUser.id}, hand='Pa')}">パー</a>
  </div>

  <!-- 対戦結果の表示（互換性用） -->
  <div class="result-box" th:if="${result}">
    <p>[[${myUser}]]の手: <strong>[[${myHand}]]</strong></p>
    <p>[[${oppUser.name}]]の手: <strong>[[${cpuHand}]]</strong></p>
    <p class="result-text">結果: [[${result}]]</p>
  </div>

  <div class="top-link">
    <a href="/janken">もどる</a>
  </div>
</body>

</html>
