<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>試合</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      font-family: sans-serif;
      margin-top: 40px;
    }

    .logout-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: flex-end;
    }

    .logout-bar a {
      color: #dc3545;
      text-decoration: none;
      font-size: 14px;
    }

    .logout-bar a:hover {
      text-decoration: underline;
    }

    .top-link {
      margin-top: 24px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="logout-bar">
    <a href="/logout">ログアウト</a>
  </div>

  <h1>試合</h1>

  <!-- Task 5: ほんだ vs CPU などの対戦相手表示 -->
  <div th:if="${myUser != null and oppUser != null}">
    <h2>[[${myUser}]] vs [[${oppUser.name}]]</h2>
  </div>

  <div class="top-link">
    <a href="/janken">もどる</a>
  </div>
</body>

</html>
